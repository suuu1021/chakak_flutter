name: chakak_flutter
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.6
  flutter_lints: ^5.0.0
  validators: ^3.0.0
  intl: ^0.18.1
  cupertino_icons: ^1.0.2
  dio: ^5.2.0
  flutter_riverpod: ^2.3.6
  logger: ^1.3.0
  flutter_secure_storage: ^8.0.0
  http: ^1.2.2
  cached_network_image: ^3.4.1
  image_picker: ^1.0.7
  carousel_slider: ^5.1.1
  share_plus: ^7.2.1
  url_launcher: ^6.2.2  
  shared_preferences: ^2.5.3


dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Modak
      fonts:
        - asset: assets/fonts/Modak-Regular.ttf

